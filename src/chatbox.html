<div id="window">
	<div id="header"></div>
	<div id="body">
		<template id="message-template">
			<div class="message">
				<div class="message-content"></div>
				<div class="message-info"></div>
			</div>
		</template>
	</div>
	<form id="footer" action="#" method="dialog">
		<div id="input-buttons">
		</div>
		<div id="input-text">
			<input id="prompt" type="text" name="prompt" autocomplete="off" placeholder="Type something...">
			<button id="send">Send</button>
		</div>
	</form>
</div>
<img id="image"/>
