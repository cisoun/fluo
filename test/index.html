<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<script src="../build/fluo.js" type="text/javascript"></script>
	<title>Fluo bot demo</title>
	<style type="text/css">
		body {
			background-color: white;;
			border: 0;
			margin: 2rem;
			font-family: sans-serif;
		}
		#version {
			background-color: black;
			border-radius: 5px;
			color: white;
			font-family: monospace;
			font-size: 0.8rem;
			padding: 0.2rem 0.5rem;
			vertical-align: middle;
		}
		code {
			background-color: #eee;
			border: 1px solid #ccc;
			border-radius: 3px;
			color: #333;
			padding: 0.1rem 0.3rem;
		}
	</style>
</head>
<body>
	<h1>Fluo bot demo <span id="version"></span></h1>
	<p>Run <code>npm run dev</code> first to try this example.</p>
	<script type="text/javascript">
		const {
			Bot,
			say,
			input,
			image,
			buttons,
			listen,
			when,
			goto,
			wait
		} = Fluo;

		const model = {
			flows: {
				MAIN: [
					say     ('<b>Welcome to the demo chatbot!</b>'),
					wait    (1),
					say     ("What's your name?"),
					input   ('name'),
					say     ("Hello {{name}}. What do you need?"),
					buttons ('Pizza', 'Donut')
				],
				PIZZA: [
					image   ('./pizza.jpg'),
					say     ('Alright, which size?'),
					buttons ('Big', 'Small'),
					listen  (),
					when    ('big',   say('Ambitious!')),
					when    ('small', say('Not so ambitious...'))
				],
				DONUT: [
					say     ('Here you go {{name}}! <h1>🍩🍩🍩</h1>'),
				],
				WHAT: [
					say     ("I don't understand...")
				],
				UNKNOWN: [
					listen  (),
					when    ('pizza', goto('PIZZA')),
					when    ('donut', goto('DONUT')),
					goto    ('WHAT')
				],
			}
		}

		const bot = new Bot({model, title: 'Fluo demo'});

		document.getElementById('version').innerHTML = Fluo.version;
	</script>
</body>
</html>
